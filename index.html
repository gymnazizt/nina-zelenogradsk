    <div style="font-size:13px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#B4D7FF;margin-bottom:24px">Зеленоградск · маленький городок у Балтийского моря</div>
    <h1 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(40px,7vw,88px);line-height:1.05;margin:0 0 28px;max-width:1040px;text-wrap:balance;color:#FFFFFF">Весь городок как на ладони, а ваша квартира в самом его сердце</h1>
    <p style="font-size:clamp(16px,2.4vw,19px);color:#DCE8F8;margin:0 0 20px;max-width:680px">Черепичные крыши, зелёные улицы и море на горизонте: сверху Зеленоградск похож на игрушечный городок, который невозможно не полюбить. Квартира на улице Октябрьской, с отдельным входом и палисадником, стоит прямо в его центре.</p>
    <p style="font-size:clamp(16px,2.4vw,19px);color:#DCE8F8;margin:0 0 40px;max-width:680px">Несколько минут пешком до моря, площади Роза ветров и главной набережной. А дальше всё просто: гулять, дышать морем и возвращаться сюда ещё не раз.</p>

            <svg viewBox="0 0 32 24" width="32" height="24" aria-hidden="true"><path d="M0 24V13C0 6 4 1.5 11 0l1.5 3C8.5 4.5 7 7 7 10h5v14zM19 24V13c0-7 4-11.5 11-13l1.500 3C27.500 4.5 26 7 26 10h5v14z" fill="#7DBAFF"/></svg>

        </div>

  <!-- TRAVEL -->
  <section id="travel" style="max-width:1120px;margin:0 auto;padding:80px 20px 0;box-sizing:border-box">
    <div style="text-shadow:0 0 6px rgba(0,0,0,0.7),0 1px 14px rgba(0,0,0,0.85)">
      <div style="font-size:13px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#B4D7FF;margin-bottom:16px">Дорога к морю</div>
      <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:0 0 16px">Из Москвы и Петербурга к морю: проще, чем кажется</h2>
      <p style="margin:0 0 32px;font-size:17px;color:#DCE8F8;max-width:640px">Самолёт до Калининграда летит около двух часов, а дальше мы всё упростили. Отпуск начинается ещё в кресле у иллюминатора.</p>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:14px">
      <div style="flex:1 1 420px;min-width:0;position:relative;overflow:hidden;isolation:isolate;text-shadow:0 0 3px rgba(0,10,40,0.9),0 1px 10px rgba(0,10,40,0.9);background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box"><svg aria-hidden="true" viewBox="0 0 400 300" preserveAspectRatio="xMaxYMax slice" style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:0.38"><circle cx="330" cy="236" r="40" fill="#FFD79A"/><rect y="236" width="400" height="70" fill="#0A47B8"/><g fill="none" stroke="#7DBAFF" stroke-width="3" stroke-linecap="round" opacity="0.8"><path d="M180 256q15-9 30 0t30 0t30 0t30 0t30 0t30 0"/><path d="M220 276q15-9 30 0t30 0t30 0t30 0"/></g><path d="M110 224q70-110 190-120" fill="none" stroke="#BFD9FF" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round"/><g><ellipse cx="318" cy="98" rx="56" ry="15" fill="#FFFFFF"/><path d="M286 94l-28-34h20l32 32zM300 106l-24 30h18l30-26z" fill="#BFD9FF"/><path d="M366 92l16-22h-14l-14 20z" fill="#BFD9FF"/><g fill="#2E7BFF"><circle cx="300" cy="96" r="4"/><circle cx="316" cy="96" r="4"/><circle cx="332" cy="96" r="4"/></g><path d="M338 90l4-9 5 9z" fill="#0A1F55"/></g></svg><div aria-hidden="true" style="position:absolute;left:0;top:0;right:0;bottom:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(0,22,62,0.86) 0%,rgba(0,22,62,0.55) 50%,rgba(0,22,62,0.08) 100%)"></div>
        <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;margin-bottom:6px">Три шага до пляжа</div>
        <div class="step"><b>1</b><div><b style="display:inline;background:none;color:inherit;width:auto;height:auto">Самолёт до Калининграда.</b> Рейсы идут из Москвы и Санкт-Петербурга, в воздухе около двух часов. Точное время зависит от рейса и авиакомпании.<div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:8px"><a class="maplink" href="https://www.aviasales.ru/?origin=MOW&destination=KGD" target="_blank" rel="noopener">Билеты из Москвы →</a><a class="maplink" href="https://www.aviasales.ru/?origin=LED&destination=KGD" target="_blank" rel="noopener">Билеты из Петербурга →</a></div></div></div>
        <div class="step"><b>2</b><div><b style="display:inline;background:none;color:inherit;width:auto;height:auto">От аэропорта до Зеленоградска.</b> На такси или через Калининград: оттуда электричка идёт от 23 до 45 минут. Напишите Нине номер рейса, и она подскажет, как проще добраться.<div style="margin-top:8px"><a class="maplink" href="https://yandex.ru/maps/?rtext=%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4%20%D0%B0%D1%8D%D1%80%D0%BE%D0%BF%D0%BE%D1%80%D1%82%20%D0%A5%D1%80%D0%B0%D0%B1%D1%80%D0%BE%D0%B2%D0%BE~%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%9E%D0%BA%D1%82%D1%8F%D0%B1%D1%80%D1%8C%D1%81%D0%BA%D0%B0%D1%8F%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0&rtt=auto" target="_blank" rel="noopener">Маршрут от аэропорта на машине →</a></div></div></div>
        <div class="step"><b>3</b><div><b style="display:inline;background:none;color:inherit;width:auto;height:auto">Заселение без встречи.</b> Приехали в любое время суток, открыли дверь по видеоинструкции, выдохнули. Выезд до 12:00, а вот отпуск лучше не заканчивать.</div></div>
      </div>
      <div style="flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px">
        <div style="position:relative;overflow:hidden;isolation:isolate;text-shadow:0 0 3px rgba(0,10,40,0.9),0 1px 10px rgba(0,10,40,0.9);background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box"><svg aria-hidden="true" viewBox="0 0 400 120" preserveAspectRatio="xMaxYMid slice" style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:0.52"><rect y="84" width="400" height="22" fill="#0A2F7C"/><path d="M0 95h400" stroke="#7DBAFF" stroke-width="2" stroke-dasharray="14 12"/><g><rect x="196" y="64" width="46" height="22" rx="8" fill="#2E7BFF"/><rect x="250" y="64" width="46" height="22" rx="8" fill="#BFD9FF"/><rect x="304" y="64" width="46" height="22" rx="8" fill="#2E7BFF"/><circle cx="208" cy="88" r="5" fill="#0A1F55"/><circle cx="232" cy="88" r="5" fill="#0A1F55"/><circle cx="262" cy="88" r="5" fill="#0A1F55"/><circle cx="286" cy="88" r="5" fill="#0A1F55"/><circle cx="316" cy="88" r="5" fill="#0A1F55"/><circle cx="340" cy="88" r="5" fill="#0A1F55"/><g fill="#FF8A6B"><circle cx="198" cy="72" r="3"/><circle cx="252" cy="72" r="3"/><circle cx="306" cy="72" r="3"/></g></g><g><path d="M364 70h30l-4 16h-22z" fill="#EAF2FF"/><path d="M368 70q4-10 10-6q6-4 10 6z" fill="#FFC46B"/><path d="M360 56l2-14l9 8zM392 56l-2-14l-9 8z" fill="#3563C9"/><circle cx="376" cy="58" r="12" fill="#3563C9"/></g></svg><div aria-hidden="true" style="position:absolute;left:0;top:0;right:0;bottom:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(0,22,62,0.86) 0%,rgba(0,22,62,0.62) 45%,rgba(0,22,62,0.12) 100%)"></div><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF;margin-bottom:6px">Москвичам</div><div style="font-size:16px;color:#DCE8F8">Море здесь настоящее, а пробки бывают только у кота перед миской. Часы в Зеленоградске отстают от московских на час: отдых начинается как будто раньше.</div></div>
        <div style="position:relative;overflow:hidden;isolation:isolate;text-shadow:0 0 3px rgba(0,10,40,0.9),0 1px 10px rgba(0,10,40,0.9);background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box"><svg aria-hidden="true" viewBox="0 0 400 120" preserveAspectRatio="xMaxYMid slice" style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:0.52"><rect y="96" width="400" height="30" fill="#0A47B8"/><path d="M0 104q15-8 30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0" fill="none" stroke="#7DBAFF" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/><g fill="#BFD9FF"><rect x="214" y="70" width="14" height="30"/><rect x="332" y="70" width="14" height="30"/><path d="M228 70l36-50l8 6l-30 44zM332 70l-36-50l-8 6l30 44z"/><rect x="190" y="70" width="40" height="7"/><rect x="330" y="70" width="40" height="7"/></g><path d="M214 70h-14" stroke="#EAF2FF" stroke-width="4"/><g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path d="M258 36q8-9 16 0q8-9 16 0"/><path d="M370 28q6-7 12 0q6-7 12 0"/></g></svg><div aria-hidden="true" style="position:absolute;left:0;top:0;right:0;bottom:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(0,22,62,0.86) 0%,rgba(0,22,62,0.62) 45%,rgba(0,22,62,0.12) 100%)"></div><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF;margin-bottom:6px">Петербуржцам</div><div style="font-size:16px;color:#DCE8F8">Родная Балтика, только пляж широкий и песчаный. Чайки те же, но к зонтику ведут себя уважительнее. Часы на час позади, как раз успеете на закат.</div></div>

        <p style="margin:0 0 16px;font-size:17px;color:#DCE8F8;max-width:480px">Выберите даты и число гостей: откроется Telegram с готовым сообщением для Нины. Останется нажать «Отправить».</p>
        <p style="margin:0 0 12px;font-size:14px;color:#D6E4F7;max-width:480px">Кот-консультант на подтверждение брони не уполномочен: его «мяу» означает «да», но последнее слово всё равно за Ниной.</p>
        <p style="margin:0;font-size:14px;color:#D6E4F7;max-width:480px">Это запрос, а не оплата: мы пока только знакомимся. Бронь подтверждается после ответа Нины.</p>
      </div>
      <div style="position:relative;flex:1 1 380px;min-width:0;background:rgba(2,38,100,0.85);border:1px solid #2B64C7;border-radius:24px;padding:clamp(20px,4vw,32px);box-sizing:border-box">
        <svg class="peek" viewBox="0 0 90 46" width="84" height="43" aria-hidden="true" style="position:absolute;top:-41px;right:36px;pointer-events:none"><path d="M12 26 L14 3 L33 15 Z M78 26 L76 3 L57 15 Z" fill="#07163F" stroke="rgba(255,255,255,0.35)" stroke-width="1"/><path d="M17 20 L18 9 L26 15 Z M73 20 L72 9 L64 15 Z" fill="#1E4A9A"/><path d="M5 46 C5 18 20 8 45 8 C70 8 85 18 85 46 Z" fill="#07163F" stroke="rgba(255,255,255,0.35)" stroke-width="1"/><ellipse class="catEye" cx="32" cy="30" rx="4" ry="5" fill="#7DBAFF"/><ellipse class="catEye" cx="58" cy="30" rx="4" ry="5" fill="#7DBAFF"/><path d="M42 38 L48 38 L45 42 Z" fill="#E7A6B8"/><path d="M26 40 L10 38 M26 43 L12 46 M64 40 L80 38 M64 43 L78 46" stroke="rgba(255,255,255,0.45)" stroke-width="1" fill="none"/></svg>
        <div style="display:flex;flex-wrap:nowrap;gap:10px;margin-bottom:20px">
          <div style="flex:1 1 0;min-width:0">
            <label for="ci" style="display:block;font-size:13px;font-weight:600;color:#DCE8F8;margin-bottom:8px">Заезд</label>
            <input id="ci" type="date" value="{{checkin}}" min="{{today}}" onChange="{{setCheckin}}" style="display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;overflow:hidden;min-height:40px;padding:0 6px;background:#011D4D;color:#FFFFFF;border:1px solid #5381D2;border-radius:10px;font:inherit;font-size:14px;-webkit-appearance:none;appearance:none">
          </div>
          <div style="flex:1 1 0;min-width:0">
            <label for="co" style="display:block;font-size:13px;font-weight:600;color:#DCE8F8;margin-bottom:8px">Выезд</label>
            <input id="co" type="date" value="{{checkout}}" min="{{minCheckout}}" onChange="{{setCheckout}}" style="display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;overflow:hidden;min-height:40px;padding:0 6px;background:#011D4D;color:#FFFFFF;border:1px solid #5381D2;border-radius:10px;font:inherit;font-size:14px;-webkit-appearance:none;appearance:none">
          </div>
        </div>
        <div style="font-size:13px;font-weight:600;color:#DCE8F8;margin-bottom:8px">Гостей (до 3)</div>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">
          <button onClick="{{guestsDec}}" aria-label="Меньше гостей" style="width:48px;height:48px;border-radius:999px;border:1px solid #5381D2;background:#011D4D;color:#FFFFFF;font-size:22px;cursor:pointer">−</button>
          <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;font-weight:600;min-width:32px;text-align:center">{{guests}}</span>
          <button onClick="{{guestsInc}}" aria-label="Больше гостей" style="width:48px;height:48px;border-radius:999px;border:1px solid #5381D2;background:#011D4D;color:#FFFFFF;font-size:22px;cursor:pointer">+</button>
        </div>
        <div style="border-top:1px solid #2B64C7;padding-top:16px;margin-bottom:20px;font-size:15px;color:#DCE8F8">{{summary}}</div>
        <sc-if value="{{dateError}}" hint-placeholder-val="{{false}}">
          <div style="margin-bottom:16px;font-size:14px;color:#FFC2B0">Дата выезда должна быть позже даты заезда: машину времени пока не завезли.</div>
        </sc-if>
        <a href="{{bookingLink}}" target="_blank" rel="noopener" style="display:block;text-align:center;background:#FFFFFF;color:#043385;text-decoration:none;font-weight:700;font-size:17px;padding:17px 24px;border-radius:999px">Отправить запрос в Telegram</a>
      </div>
    </div>
  </section>

            <div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Живая история</div>
            <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Императорский дуб</div>
            <div style="font-size:15px;color:#DCE8F8">Дуб посадили в 1872 году в честь кайзера Вильгельма I, первого императора объединённой Германии. Ему больше 150 лет, и среди остальной зелени он заметен сразу.</div>
            <div style="font-size:15px;color:#DCE8F8">Растёт в городском парке, который в немецкую эпоху принадлежал курорту Кранц. Вокруг дерева устроена площадка с дорожкой и информационной табличкой, так что фото на память получаются сами собой.</div>

        <p style="margin:0 0 20px;color:#D6E4F7">Из Калининграда до Зеленоградска проще всего на поезде или автобусе.</p>
        <div style="display:flex;flex-direction:column;margin-bottom:24px">
          <div style="padding:14px 0;border-bottom:1px solid #2B64C7"><div style="font-weight:700">Электричка</div><div style="font-size:15px;color:#DCE8F8">Около 45 минут, от Южного вокзала Калининграда.</div><div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:8px"><a class="maplink" href="https://rasp.yandex.ru/search/?fromName=%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4&amp;toName=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA&amp;transportType=suburban" target="_blank" rel="noopener">Расписание: Калининград → Зеленоградск</a><a class="maplink" href="https://rasp.yandex.ru/search/?fromName=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA&amp;toName=%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4&amp;transportType=suburban" target="_blank" rel="noopener">Обратно →</a></div></div>
          <div style="padding:14px 0;border-bottom:1px solid #2B64C7"><div style="font-weight:700">Автобус</div><div style="font-size:15px;color:#DCE8F8">Около часа, от автовокзала рядом с Южным вокзалом. Рейсы ходят часто.</div><div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:8px"><a class="maplink" href="https://rasp.yandex.ru/search/?fromName=%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4&amp;toName=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA&amp;transportType=bus" target="_blank" rel="noopener">Расписание: Калининград → Зеленоградск</a><a class="maplink" href="https://rasp.yandex.ru/search/?fromName=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA&amp;toName=%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4&amp;transportType=bus" target="_blank" rel="noopener">Обратно →</a></div></div>
          <div style="padding:14px 0;border-bottom:1px solid #2B64C7"><div style="font-weight:700">На автомобиле</div><div style="font-size:15px;color:#DCE8F8">У квартиры есть машиноместо.</div></div>
        </div>
        <div style="margin:0 0 24px">
          <div style="font-weight:700;font-size:18px;margin-bottom:4px">От вокзала до квартиры</div>
          <div class="step"><b>1</b><div>Выходите из поезда или автобуса на вокзале Зеленоградска.</div></div>
          <div class="step"><b>2</b><div>Откройте маршрут на карте: пешком или на машине, как удобнее.</div></div>
          <div class="step"><b>3</b><div>Входите через отдельный вход со стороны палисадника. Инструкцию по заселению Нина пришлёт заранее.</div></div>
          <div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px"><a class="maplink" href="https://yandex.ru/maps/?rtext=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%B6%D0%B5%D0%BB%D0%B5%D0%B7%D0%BD%D0%BE%D0%B4%D0%BE%D1%80%D0%BE%D0%B6%D0%BD%D0%B0%D1%8F%20%D1%81%D1%82%D0%B0%D0%BD%D1%86%D0%B8%D1%8F~%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%9E%D0%BA%D1%82%D1%8F%D0%B1%D1%80%D1%8C%D1%81%D0%BA%D0%B0%D1%8F%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0&rtt=pd" target="_blank" rel="noopener">Маршрут пешком →</a><a class="maplink" href="https://yandex.ru/maps/?rtext=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%B6%D0%B5%D0%BB%D0%B5%D0%B7%D0%BD%D0%BE%D0%B4%D0%BE%D1%80%D0%BE%D0%B6%D0%BD%D0%B0%D1%8F%20%D1%81%D1%82%D0%B0%D0%BD%D1%86%D0%B8%D1%8F~%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%9E%D0%BA%D1%82%D1%8F%D0%B1%D1%80%D1%8C%D1%81%D0%BA%D0%B0%D1%8F%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0&rtt=auto" target="_blank" rel="noopener">Маршрут на машине →</a></div>
        </div>
        <p style="margin:0 0 20px;font-size:14px;color:#D6E4F7">Расписание и цены меняются, ссылки выше открывают актуальные рейсы на Яндекс Расписаниях. Проверьте их перед поездкой.</p>
        <div style="display:flex;flex-wrap:wrap;gap:12px">
          <a href="https://yandex.ru/maps/?text=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%2C%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%9E%D0%BA%D1%82%D1%8F%D0%B1%D1%80%D1%8C%D1%81%D0%BA%D0%B0%D1%8F" target="_blank" rel="noopener" style="background:transparent;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;border:1px solid #5381D2">Улица Октябрьская на карте</a>
          <a href="https://yandex.ru/maps/?text=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%B6%D0%B5%D0%BB%D0%B5%D0%B7%D0%BD%D0%BE%D0%B4%D0%BE%D1%80%D0%BE%D0%B6%D0%BD%D0%B0%D1%8F%20%D1%81%D1%82%D0%B0%D0%BD%D1%86%D0%B8%D1%8F" target="_blank" rel="noopener" style="background:transparent;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;border:1px solid #5381D2">Вокзал на карте</a>
        </div>
      </div>
    </div>
  </section>

  <!-- FAVORITES -->
  <section id="favorites" style="max-width:1120px;margin:0 auto;padding:80px 20px;box-sizing:border-box">
    <div style="text-shadow:0 0 6px rgba(0,0,0,0.7),0 1px 14px rgba(0,0,0,0.85)">
      <div style="font-size:13px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#B4D7FF;margin-bottom:16px">Советы хозяйки</div>
      <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:0 0 16px">Любимые места Нины</h2>
      <p style="margin:0 0 32px;font-size:17px;color:#DCE8F8;max-width:620px">Куда Нина ходит сама и куда отправляет гостей. Нажмите «Открыть на карте», чтобы построить маршрут.</p>
    </div>
    <details class="acc"><summary>Показать любимые места</summary><div class="accbody">
    <div style="display:flex;flex-wrap:wrap;gap:14px">
      <sc-for list="{{places}}" as="p" hint-placeholder-count="6">
        <div class="place">
          <div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">{{p.cat}}</div>
          <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:600;line-height:1.15">{{p.name}}</div>
          <sc-if value="{{p.hasImg}}" hint-placeholder-val="{{false}}"><div class="dancing"><a href="{{p.img}}" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img src="{{p.img}}" alt="{{p.imgAlt}}" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:{{p.imgPos}}"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">{{p.imgCap}}</span></a></div></sc-if>
          <div style="font-size:15px;color:#DCE8F8;flex:1">{{p.note}}</div>
          <a class="maplink" href="{{p.link}}" target="_blank" rel="noopener">Открыть на карте →</a>
        </div>
      </sc-for>
    </div>
    <div style="margin-top:24px"><a href="https://yandex.ru/maps/?text=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA" target="_blank" rel="noopener" style="display:inline-block;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;border:1px solid #5381D2">Весь Зеленоградск на карте</a></div>
    </div></details>
  </section>

  <!-- TRIPS -->
  <section id="trips" style="max-width:1120px;margin:0 auto;padding:0 20px 80px;box-sizing:border-box">
    <div style="text-shadow:0 0 6px rgba(0,0,0,0.7),0 1px 14px rgba(0,0,0,0.85)">
      <div style="font-size:13px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#B4D7FF;margin-bottom:16px">Куда съездить на день</div>
      <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:0 0 16px">Если захочется чуть дальше</h2>
      <p style="margin:0 0 32px;font-size:17px;color:#DCE8F8;max-width:640px">Три идеи на день, а вечером всё равно домой, к морю. Точное время в пути покажет карта: оно зависит от дороги и сезона.</p>
    </div>
    <details class="acc"><summary>Показать идеи на день</summary><div class="accbody">
    <div style="margin-bottom:14px;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box">
      <div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF;margin-bottom:6px">На двух колёсах</div>
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:600;line-height:1.1;margin-bottom:8px">Велодорожка вдоль моря</div><div class="dancing" style="max-width:300px;margin:0 0 12px"><a href="images/ph-bike2.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="596" height="470" src="images/ph-bike2.jpg" alt="Велосипедист на кирпичной дорожке среди берёз на закате, справа море" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;object-position:50% 70%"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Велодорожка</span></a></div>
      <p style="margin:0 0 10px;font-size:16px;color:#DCE8F8;max-width:760px">От променада Зеленоградска вдоль моря и дюн в сторону Светлогорска тянется велосипедная и пешеходная дорожка. По данным путеводителей, её протяжённость до 40 километров, так что скучно не будет: ни вам, ни велосипеду.</p>
      <p style="margin:0 0 16px;font-size:16px;color:#DCE8F8;max-width:760px">Прокат велосипедов в городе есть, пункты и цены смотрите на карте. Или напишите Нине, она подскажет, где взять велосипед и какой выбрать. Совет: ветер с моря на обратном пути любит сюрпризы, поэтому поездку лучше планировать без подвигов.</p>
      <div style="display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center">
        <a href="https://yandex.ru/maps/?text=%D0%BF%D1%80%D0%BE%D0%BA%D0%B0%D1%82%20%D0%B2%D0%B5%D0%BB%D0%BE%D1%81%D0%B8%D0%BF%D0%B5%D0%B4%D0%BE%D0%B2%20%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA" target="_blank" rel="noopener" style="display:inline-block;background:#FFFFFF;color:#043385;text-decoration:none;font-weight:700;font-size:15px;padding:13px 22px;border-radius:999px;font-family:inherit">Прокат на карте</a>
        <a class="maplink" href="https://yandex.ru/maps/-/CXvwYWKA" target="_blank" rel="noopener">Велосипедный маршрут в Светлогорск →</a>
        <a class="maplink" href="https://t.me/rasstriga70?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%2C%20%D0%9D%D0%B8%D0%BD%D0%B0%21%20%D0%9F%D0%BE%D0%B4%D1%81%D0%BA%D0%B0%D0%B6%D0%B8%D1%82%D0%B5%2C%20%D0%BF%D0%BE%D0%B6%D0%B0%D0%BB%D1%83%D0%B9%D1%81%D1%82%D0%B0%2C%20%D0%B3%D0%B4%D0%B5%20%D0%B2%20%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%D0%B5%20%D0%B2%D0%B7%D1%8F%D1%82%D1%8C%20%D0%BD%D0%B0%D0%BF%D1%80%D0%BE%D0%BA%D0%B0%D1%82%20%D0%B2%D0%B5%D0%BB%D0%BE%D1%81%D0%B8%D0%BF%D0%B5%D0%B4%D1%8B%3F" target="_blank" rel="noopener">Спросить Нину в Telegram →</a>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:14px">
      <div style="flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Соседний курорт</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Светлогорск</div><div class="dancing"><a href="images/svetlogorsk.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="960" height="960" src="images/svetlogorsk.jpg" alt="Водонапорная башня в Светлогорске" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:21/9;object-fit:cover;object-position:50% 30%"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Водонапорная башня</span></a></div><div style="font-size:15px;color:#DCE8F8;flex:1">Курортный городок с парками, старинной архитектурой и тем же морем, но с другого ракурса. Узнаваемый символ города, водонапорная башня на фото, виден издалека, так что заблудиться сложно. Хорошо для дня «хочу чего-то нового, но недалеко».</div><a class="maplink" href="https://yandex.ru/maps/?rtext=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%2C%20%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%D0%B0%D1%8F%20%D0%BE%D0%B1%D0%BB%D0%B0%D1%81%D1%82%D1%8C~%D0%A1%D0%B2%D0%B5%D1%82%D0%BB%D0%BE%D0%B3%D0%BE%D1%80%D1%81%D0%BA%2C%20%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%D0%B0%D1%8F%20%D0%BE%D0%B1%D0%BB%D0%B0%D1%81%D1%82%D1%8C&rtt=auto" target="_blank" rel="noopener">Построить маршрут →</a></div>
      <div style="flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Национальный парк</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Куршская коса</div><div class="dancing"><a href="images/dancing-forest.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="640" height="299" src="images/dancing-forest.jpg" alt="Танцующий лес на Куршской косе" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:21/9;object-fit:cover"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Танцующий лес</span></a></div><div style="font-size:15px;color:#DCE8F8;flex:1">Дюны, сосны и знаменитый Танцующий лес: деревья здесь закручены в петли и кольца, будто решили потанцевать. Фото на память получаются лучше, чем про отпуск в офисе. Берите удобную обувь и неторопливое настроение.</div><a class="maplink" href="https://yandex.ru/maps/?rtext=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA~%D0%9A%D1%83%D1%80%D1%88%D1%81%D0%BA%D0%B0%D1%8F%20%D0%BA%D0%BE%D1%81%D0%B0%20%D0%A2%D0%B0%D0%BD%D1%86%D1%83%D1%8E%D1%89%D0%B8%D0%B9%20%D0%BB%D0%B5%D1%81&rtt=auto" target="_blank" rel="noopener">Построить маршрут →</a></div>
      <div style="flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Столица региона</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Калининград</div><div class="dancing"><a href="images/kaliningrad.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="1024" height="683" src="images/kaliningrad.jpg" alt="Кафедральный собор на острове Канта в Калининграде" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:21/9;object-fit:cover;object-position:50% 45%"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Кафедральный собор</span></a></div><div style="font-size:15px;color:#DCE8F8;flex:1">Остров Канта с Кафедральным собором, зелёные набережные и старинные кварталы: для дня прогулок самое то. Электричка до города идёт от 23 до 45 минут, а сувениры из янтаря продаются прямо по дороге, так что кошелёк предупреждён.</div><a class="maplink" href="https://yandex.ru/maps/?rtext=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA~%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4%20%D0%9A%D0%B0%D1%84%D0%B5%D0%B4%D1%80%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D1%81%D0%BE%D0%B1%D0%BE%D1%80&rtt=auto" target="_blank" rel="noopener">Построить маршрут →</a></div>

  <!-- AMBER -->
  <section id="amber" style="max-width:1120px;margin:0 auto;padding:0 20px 80px;box-sizing:border-box">
    <div style="text-shadow:0 0 6px rgba(0,0,0,0.7),0 1px 14px rgba(0,0,0,0.85)">
      <div style="font-size:13px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#B4D7FF;margin-bottom:16px">Янтарный край</div>
      <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:0 0 16px">Всё про янтарь, чтобы не уехать без него</h2>
      <p style="margin:0 0 32px;font-size:17px;color:#DCE8F8;max-width:640px">Янтарь здесь не сувенир, а часть местной жизни. Вот что стоит увидеть и узнать, пока вы у моря.</p>
    </div>
    <details class="acc"><summary>Показать всё про янтарь</summary><div class="accbody">
    <div style="display:flex;flex-wrap:wrap;gap:14px">
      <div style="flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Янтарный край</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Солнечный камень</div><div class="dancing" style=""><a href="images/ph-amberpiece.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="394" height="507" src="images/ph-amberpiece.jpg" alt="Кусочек янтаря" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 58%"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Солнечный камень</span></a></div><div style="font-size:15px;color:#DCE8F8;flex:1">Калининградская область известна янтарём на весь мир: по данным путеводителей, здесь добывают около 90% мировых запасов этого камня. Так что вы отдыхаете почти на мировой янтарной столице. Кот, правда, ювелирных амбиций не проявляет.</div></div>
      <div style="flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Рядом с морем и карьером</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Посёлок Янтарный</div><div class="dancing" style=""><a href="images/ph-yantarny.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="739" height="415" src="images/ph-yantarny.jpg" alt="Пляж посёлка Янтарный" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 50%"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Пляж посёлка Янтарный</span></a></div><div style="font-size:15px;color:#DCE8F8;flex:1">Примерно в 45 километрах от Калининграда находится посёлок с янтарным комбинатом. Для туристов там есть смотровая площадка над карьером, где видна работающая техника, а ещё экспозиция и магазины. Пляж посёлка отмечен «Голубым флагом»: хорошее место, чтобы совместить науку и купание.</div><a class="maplink" href="https://yandex.ru/maps/?rtext=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA~%D0%AF%D0%BD%D1%82%D0%B0%D1%80%D0%BD%D1%8B%D0%B9%20%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%D0%B0%D1%8F%20%D0%BE%D0%B1%D0%BB%D0%B0%D1%81%D1%82%D1%8C&rtt=auto" target="_blank" rel="noopener">Построить маршрут →</a></div>
      <div style="flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Калининград</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Музей янтаря</div><div class="dancing" style=""><a href="images/ph-ambermuseum.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="330" height="247" src="images/ph-ambermuseum.jpg" alt="Башня в Калининграде" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 40%"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Музей в старой крепости</span></a></div><div style="font-size:15px;color:#DCE8F8;flex:1">Музей находится в Калининграде, в старинной оборонительной крепости. Камни здесь от молочных до медово-жёлтых и коньячных, а в некоторых застыли древние насекомые и растения. Это единственный музей, где комар за миллионы лет не потерял работу: он всё ещё в центре внимания.</div><a class="maplink" href="https://yandex.ru/maps/?text=%D0%9C%D1%83%D0%B7%D0%B5%D0%B9%20%D1%8F%D0%BD%D1%82%D0%B0%D1%80%D1%8F%20%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4" target="_blank" rel="noopener">Показать на карте →</a></div>
      <div style="flex:1 1 300px;min-width:0;position:relative;overflow:hidden;isolation:isolate;text-shadow:0 0 3px rgba(0,10,40,0.9),0 1px 10px rgba(0,10,40,0.9);background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><svg aria-hidden="true" viewBox="0 0 900 110" preserveAspectRatio="xMaxYMid meet" style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:0.52"><path d="M600 8q100 90 200 0" fill="none" stroke="#BFD9FF" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M700 74q-26 0-26 22c0 18 26 26 26 26s26-8 26-26c0-22-26-22-26-22z" fill="#FFB347" transform="translate(0,-12)"/><path d="M690 96q6-12 16-8" fill="none" stroke="#FFE2A8" stroke-width="4" stroke-linecap="round" transform="translate(0,-12)"/><g transform="translate(704,86)" fill="#5A3411"><ellipse cx="0" cy="0" rx="5" ry="3"/><path d="M-3 -2q-6-8-10-2q4 6 10 4zM3 -2q6-8 10-2q-4 6-10 4z" fill="#FFE2A8" opacity="0.8"/></g><g transform="translate(820,50) rotate(20)"><path d="M0 0q-18 0-18 16c0 14 18 20 18 20s18-6 18-20c0-16-18-16-18-16z" fill="#FFC46B"/></g></svg><div aria-hidden="true" style="position:absolute;left:0;top:0;right:0;bottom:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(0,22,62,0.86) 0%,rgba(0,22,62,0.66) 55%,rgba(0,22,62,0.42) 100%)"></div><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Зеленоградск</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Янтарь на память</div><div style="font-size:15px;color:#DCE8F8;flex:1">Украшения из янтаря продают и в Зеленоградске: бутики есть на Курортном проспекте. При покупке сохраняйте чек, а изделие просите хорошо упаковать. Если хочется чего-то съедобного, зато без инклюзов, это уже к кондитерской.</div><a class="maplink" href="https://yandex.ru/maps/?text=%D1%8F%D0%BD%D1%82%D0%B0%D1%80%D1%8C%20%D1%83%D0%BA%D1%80%D0%B0%D1%88%D0%B5%D0%BD%D0%B8%D1%8F%20%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%9A%D1%83%D1%80%D0%BE%D1%80%D1%82%D0%BD%D1%8B%D0%B9%20%D0%BF%D1%80%D0%BE%D1%81%D0%BF%D0%B5%D0%BA%D1%82" target="_blank" rel="noopener">Найти на карте →</a></div>
    </div>
    <div class="amberpics" style="display:flex;flex-wrap:wrap;gap:14px;margin-top:14px"><a href="images/amber-1.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;flex:1 1 300px;min-width:0;border-radius:18px;overflow:hidden;background:#0C3375"><img width="1200" height="900" src="images/amber-1.jpg" alt="Янтарь на ладони" loading="lazy" style="display:block;width:100%;height:100%;aspect-ratio:4/3;object-fit:cover"><span style="position:absolute;left:12px;bottom:12px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px">Янтарь на ладони</span></a><a href="images/amber-2.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;flex:1 1 300px;min-width:0;border-radius:18px;overflow:hidden;background:#0C3375"><img width="1126" height="967" src="images/amber-2.jpg" alt="Янтарь на песке у моря" loading="lazy" style="display:block;width:100%;height:100%;aspect-ratio:4/3;object-fit:cover"><span style="position:absolute;left:12px;bottom:12px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px">Янтарь на песке у моря</span></a></div>
    <div style="margin-top:14px;position:relative;overflow:hidden;isolation:isolate;text-shadow:0 0 3px rgba(0,10,40,0.9),0 1px 10px rgba(0,10,40,0.9);background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box"><svg aria-hidden="true" viewBox="0 0 900 110" preserveAspectRatio="xMaxYMid meet" style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:0.52"><circle cx="760" cy="84" r="34" fill="#FFD79A"/><rect y="84" width="900" height="30" fill="#0A47B8"/><g stroke="#FFD79A" stroke-width="3" stroke-linecap="round" opacity="0.7"><path d="M730 92h60M738 100h44"/></g><path d="M640 52h54l-8 46h-38z" fill="#FF8A6B"/><path d="M646 52q21-22 42 0" fill="none" stroke="#FF8A6B" stroke-width="5"/><path d="M644 66h46M648 80h38" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/><g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path d="M820 30q8-9 16 0q8-9 16 0"/></g></svg><div aria-hidden="true" style="position:absolute;left:0;top:0;right:0;bottom:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(0,22,62,0.86) 0%,rgba(0,22,62,0.66) 55%,rgba(0,22,62,0.42) 100%)"></div>

  <!-- PRUSSIA -->
  <section id="prussia" style="max-width:1120px;margin:0 auto;padding:0 20px 80px;box-sizing:border-box">
    <div style="text-shadow:0 0 6px rgba(0,0,0,0.7),0 1px 14px rgba(0,0,0,0.85)">
      <div style="font-size:13px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#B4D7FF;margin-bottom:16px">Старая Пруссия</div>
      <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:0 0 16px">Готика, фахверк и рыцарские замки</h2>
      <p style="margin:0 0 32px;font-size:17px;color:#DCE8F8;max-width:640px">Калининградский край был частью Восточной Пруссии, и это чувствуется в каждом старом здании. Хорошее дополнение к морю: утром пляж, днём средневековье.</p>
    </div>
    <details class="acc"><summary>Показать замки и старину</summary><div class="accbody">
    <div style="display:flex;flex-wrap:wrap;gap:14px">
      <div style="flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Столица Восточной Пруссии</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Кёнигсберг</div><div class="dancing" style=""><a href="images/ph-oldkon.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="640" height="480" src="images/ph-oldkon.jpg" alt="Старый Кёнигсберг" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 40%"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Старый Кёнигсберг</span></a></div><div style="font-size:15px;color:#DCE8F8;flex:1">До 1945 года нынешний Калининград назывался Кёнигсберг и был столицей Восточной Пруссии. Город помнит это до сих пор: в его старых кварталах немецкая история читается прямо по фасадам. Правда, домовые коты тут говорят по-русски.</div></div>
      <div style="flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Кафедральный собор</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Готика острова Канта</div><div class="dancing" style=""><a href="images/ph-kantisland.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="657" height="467" src="images/ph-kantisland.jpg" alt="Остров Канта и Рыбная деревня" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 50%"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Набережная и собор вдали</span></a></div><div style="font-size:15px;color:#DCE8F8;flex:1">Собор стоит на острове Канта, который раньше назывался Кнайпхоф. Внутри усыпальница магистров Тевтонского ордена, могила Канта и макет довоенного Кёнигсберга. Если хотите понять город, начните отсюда.</div><a class="maplink" href="https://yandex.ru/maps/?text=%D0%9A%D0%B0%D1%84%D0%B5%D0%B4%D1%80%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D1%81%D0%BE%D0%B1%D0%BE%D1%80%20%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4" target="_blank" rel="noopener">Показать на карте →</a></div>
      <div style="flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Старый Кёнигсберг</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Ворота и Рыбная деревня</div><div class="dancing" style=""><a href="images/ph-fishvillage.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="1200" height="786" src="images/ph-fishvillage.jpg" alt="Рыбная деревня в Калининграде" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 40%"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Рыбная деревня</span></a></div><div style="font-size:15px;color:#DCE8F8;flex:1">Королевские ворота похожи на сказочный замок: когда-то через них проезжали экипажи прусской знати, а сегодня там городской музей. В Рыбной деревне здания построены в духе классической немецкой застройки.</div><a class="maplink" href="https://yandex.ru/maps/?text=%D0%9A%D0%BE%D1%80%D0%BE%D0%BB%D0%B5%D0%B2%D1%81%D0%BA%D0%B8%D0%B5%20%D0%B2%D0%BE%D1%80%D0%BE%D1%82%D0%B0%20%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4" target="_blank" rel="noopener">Королевские ворота →</a></div>
      <div style="flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">За пределами города</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Рыцарские замки и кирхи</div><div class="dancing" style=""><a href="images/ph-castle.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="648" height="473" src="images/ph-castle.jpg" alt="Замок из красного кирпича" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 40%"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Красный кирпич и башни</span></a></div><div style="font-size:15px;color:#DCE8F8;flex:1">Тевтонский орден оставил по области замки и готические кирхи, например в Гвардейске и Советске. Фахверковые домики и старые фортификации попадаются и в самых тихих уголках. Идеальный маршрут для тех, кому мало пляжа.</div><a class="maplink" href="https://yandex.ru/maps/?text=%D0%B7%D0%B0%D0%BC%D0%BE%D0%BA%20%D0%A2%D0%B5%D0%B2%D1%82%D0%BE%D0%BD%D1%81%D0%BA%D0%BE%D0%B3%D0%BE%20%D0%BE%D1%80%D0%B4%D0%B5%D0%BD%D0%B0%20%D0%93%D0%B2%D0%B0%D1%80%D0%B4%D0%B5%D0%B9%D1%81%D0%BA%20%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%D0%B0%D1%8F%20%D0%BE%D0%B1%D0%BB%D0%B0%D1%81%D1%82%D1%8C" target="_blank" rel="noopener">Замок в Гвардейске →</a></div>
      <div style="flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Зеленоградск и Светлогорск</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Кранц и Раушен</div><div class="dancing" style=""><a href="images/ph-cranz.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="600" height="399" src="images/ph-cranz.jpg" alt="Старая открытка с видом Кранца" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 35%"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Кранц на старой открытке</span></a></div><div style="font-size:15px;color:#DCE8F8;flex:1">Раньше курорты, где вы отдыхаете, назывались иначе: Зеленоградск был Кранцем, а Светлогорск Раушеном. Немецкий курортный стиль тут сохранился в архитектуре, так что отдыхать можно с историческим уклоном.</div><a class="maplink" href="https://yandex.ru/maps/?text=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%BA%D1%83%D1%80%D0%BE%D1%80%D1%82%D0%BD%D0%B0%D1%8F%20%D0%B0%D1%80%D1%85%D0%B8%D1%82%D0%B5%D0%BA%D1%82%D1%83%D1%80%D0%B0" target="_blank" rel="noopener">Прогулка по городу →</a></div>
      <div style="flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px"><div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF">Архитектура</div><div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;line-height:1.1">Кирпичная готика</div><div class="dancing" style=""><a href="images/ph-gothic.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="447" height="447" src="images/ph-gothic.jpg" alt="Здание из красного кирпича в готическом стиле" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 40%"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Красный кирпич</span></a></div><div style="font-size:15px;color:#DCE8F8;flex:1">Красный кирпич, стрельчатые окна и острые крыши: так выглядит прусская архитектура. Такие здания встречаются в городах и посёлках области, иногда в самых неожиданных дворах, поэтому смотрите не только под ноги, но и по сторонам.</div></div>
    </div>
    <div style="margin-top:14px;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box">
      <div style="display:flex;flex-wrap:wrap;gap:24px 32px;align-items:flex-start">
        <div class="dancing" style="flex:0 1 240px;min-width:200px;max-width:100%"><a href="images/ph-kant.jpg" onClick="{{openPhoto}}" style="position:relative;display:block;border-radius:14px;overflow:hidden;background:#0C3375"><img width="370" height="448" src="images/ph-kant.jpg" alt="Иммануил Кант, портрет" loading="lazy" style="display:block;width:100%;height:auto"><span style="position:absolute;left:10px;bottom:10px;background:rgba(1,30,80,0.80);color:#FFFFFF;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px">Иммануил Кант</span></a></div>
        <div style="flex:1 1 320px;min-width:0">
          <div style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B4D7FF;margin-bottom:6px">Главный житель Кёнигсберга</div>
          <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:600;line-height:1.1;margin-bottom:10px">Иммануил Кант</div>
          <p style="margin:0 0 10px;font-size:16px;color:#DCE8F8">Философ родился в Кёнигсберге в 1724 году и прожил здесь почти всю жизнь. Он преподавал в городском университете «Альбертина», а в 1781 году выпустил «Критику чистого разума», одну из самых известных книг в истории философии. Умер Кант в 1804 году, тоже в родном городе.</p>
          <p style="margin:0 0 10px;font-size:16px;color:#DCE8F8">Есть городская легенда, что горожане сверяли часы по его ежедневным прогулкам: так пунктуален был профессор. Из слов Канта чаще всего цитируют мысль о двух вещах, которые наполняют душу удивлением: «звёздное небо надо мной и моральный закон во мне».</p>
          <p style="margin:0 0 16px;font-size:16px;color:#DCE8F8">Могила Канта находится у стены Кафедрального собора на острове, который теперь носит его имя. Рядом с собором работает музей Канта. До Калининграда от Зеленоградска идёт электричка, так что к Канту можно съездить на полдня.</p>
          <div style="display:flex;flex-wrap:wrap;gap:10px 20px"><a class="maplink" href="https://yandex.ru/maps/?text=%D0%9C%D0%BE%D0%B3%D0%B8%D0%BB%D0%B0%20%D0%9A%D0%B0%D0%BD%D1%82%D0%B0%20%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4" target="_blank" rel="noopener">Могила Канта на карте →</a><a class="maplink" href="https://yandex.ru/maps/?text=%D0%9C%D1%83%D0%B7%D0%B5%D0%B9%20%D0%9A%D0%B0%D0%BD%D1%82%D0%B0%20%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4" target="_blank" rel="noopener">Музей Канта →</a></div>
        </div>
      </div>
    </div>
    </div></details>
  </section>

          <div style="font-size:13px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#B4D7FF;margin-bottom:16px">Балтика и коты</div>
          <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:0 0 16px">Зеленоградск, город кошек</h2>
          <p style="margin:0 0 16px;font-size:17px;color:#DCE8F8;max-width:520px">Кошачья тема стала частью образа этого курорта: здесь есть музей кошек, уличные арт-объекты и кошки, которые «работают» в кафе. Море, чайки и коты на одной прогулке.</p>
          <p style="margin:0 0 28px;font-size:17px;color:#DCE8F8;max-width:520px">Квартира в самом сердце города, так что кошачий маршрут удобно начать прямо от дома.</p>

        <div style="flex:1 1 360px;min-width:0;max-width:520px">

  <section id="faq" style="background:rgba(2,38,100,0.85);padding:80px 0">
    <div style="max-width:880px;margin:0 auto;padding:0 20px;box-sizing:border-box">
      <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:0 0 16px">Частые вопросы</h2>
      <div style="margin-top:24px;border-top:1px solid #2B64C7">
        <details class="q"><summary>Сколько стоит проживание?</summary><div>Стоимость зависит от дат и числа гостей. Отправьте запрос на бронь или <a href="{{tgLink}}" target="_blank" rel="noopener">напишите Нине в Telegram</a>, и она назовёт цену.</div></details>
        <details class="q"><summary>Во сколько заезд и выезд?</summary><div>Заезд с 15:00, выезд до 12:00. Заселение дистанционное и возможно в любое время суток, 24/7.</div></details>
        <details class="q"><summary>Как пользоваться замком?</summary><div>Заселение дистанционное, встречать вас лично не нужно. Как пользоваться замком, показано в коротких видео:<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:14px"><figure style="margin:0;flex:1 1 150px;max-width:220px;min-width:0"><video controls playsinline preload="metadata" poster="images/lock-1-poster.jpg" src="videos/lock-1.mp4" aria-label="Видеоинструкция 1" style="display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:14px;background:#0C3375"></video><figcaption style="font-size:14px;color:#D6E4F7;margin-top:6px;text-align:center">Видеоинструкция 1</figcaption></figure><figure style="margin:0;flex:1 1 150px;max-width:220px;min-width:0"><video controls playsinline preload="metadata" poster="images/lock-2-poster.jpg" src="videos/lock-2.mp4" aria-label="Видеоинструкция 2" style="display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:14px;background:#0C3375"></video><figcaption style="font-size:14px;color:#D6E4F7;margin-top:6px;text-align:center">Видеоинструкция 2</figcaption></figure><figure style="margin:0;flex:1 1 150px;max-width:220px;min-width:0"><video controls playsinline preload="metadata" poster="images/lock-3-poster.jpg" src="videos/lock-3.mp4" aria-label="Видеоинструкция 3" style="display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:14px;background:#0C3375"></video><figcaption style="font-size:14px;color:#D6E4F7;margin-top:6px;text-align:center">Видеоинструкция 3</figcaption></figure></div><div style="font-size:14px;color:#D6E4F7;margin-top:12px">Нажмите на видео, чтобы воспроизвести. Если что-то не получается, напишите Нине в Telegram.</div></div></details>
        <details class="q"><summary>Как долго лететь из Москвы и Санкт-Петербурга?</summary><div>В воздухе около двух часов, точное время зависит от рейса и авиакомпании. Часы в Зеленоградске отстают от московских и петербургских на час, так что отдых начинается как будто раньше. Билеты удобно искать по ссылкам в блоке «Дорога».</div></details>
        <details class="q"><summary>Сколько гостей можно разместить?</summary><div>До 3 гостей: двуспальная кровать и дополнительное спальное место для третьего гостя.</div></details>
        <details class="q"><summary>Есть ли парковка?</summary><div>Да, у квартиры есть машиноместо.</div></details>
        <details class="q"><summary>Что есть в квартире?</summary><div>Высокоскоростной Wi-Fi, Smart TV, кофемашина, полностью оборудованная кухня, стиральная машина, пляжные принадлежности (зонт и стульчики) и одноразовые тапочки.</div></details>
        <details class="q"><summary>Что такое страховой депозит?</summary><div>Депозит обязателен. Он возвращается после уборки, если имущество не повреждено и правила проживания соблюдены.</div></details>
        <details class="q"><summary>Насколько это приватно?</summary><div>У квартиры отдельный вход без подъезда и соседей, а все окна с тонировкой.</div></details>
        <details class="q"><summary>Далеко ли до моря?</summary><div>Несколько минут пешком. Чайки не успевают заскучать, пока вы идёте.</div></details>
        <details class="q"><summary>Что взять с собой?</summary><div>Хорошее настроение и купальник, остальное найдётся: кофемашина, Wi-Fi, Smart TV, пляжный зонт и стульчики. Тапочки одноразовые уже ждут.</div></details>
        <details class="q"><summary>Правда ли, что в городе все любят кошек?</summary><div>Город так и называют, поэтому встреч с пушистыми жителями не избежать. Гладить рекомендуется по взаимному согласию.</div></details>
        <details class="q"><summary>Можно ли погладить местного кота?</summary><div>Если кот сам подойдёт, это его решение, а не ваше. Если не подошёл, пожелайте ему хорошего дня и идите дальше: уважение к котам в Зеленоградске вопрос репутации.</div></details>
        <details class="q"><summary>Чайка украла мороженое: что делать?</summary><div>Страховка на этот случай не предусмотрена. Чайки на Балтике считаются стихийным бедствием, так что берегите мороженое и держите его подальше от неба.</div></details>
        <details class="q"><summary>А если не захочется уезжать?</summary><div>Это самая частая проблема. Напишите Нине заранее: если даты свободны, она продлит проживание. Кот в таких случаях обычно уже согласен.</div></details>
        <details class="q"><summary>Можно ли с питомцем или маленьким ребёнком?</summary><div>Лучше уточнить заранее: <a href="{{tgLink}}" target="_blank" rel="noopener">напишите Нине в Telegram</a>, и она ответит по вашей ситуации.</div></details>

(function(){
  const tpl=document.getElementById('tpl').content, app=document.getElementById('app');
  const get=(p,s)=>p.split('.').reduce((o,k)=>o==null?o:o[k],s);
  const sub=(str,s)=>str.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(_,p)=>{const v=get(p,s);return v==null?'':v;});
  function build(src,scope,out){
    for(const n of Array.from(src.childNodes)){
      if(n.nodeType===3){out.appendChild(document.createTextNode(sub(n.nodeValue,scope)));continue;}
      if(n.nodeType!==1)continue;
      const tag=n.localName;
      if(tag==='sc-if'){const m=(n.getAttribute('value')||'').match(/\{\{\s*([\w.]+)\s*\}\}/);if(m&&get(m[1],scope))build(n,scope,out);continue;}
      if(tag==='sc-for'){const m=(n.getAttribute('list')||'').match(/\{\{\s*([\w.]+)\s*\}\}/);const as=n.getAttribute('as');const list=(m&&get(m[1],scope))||[];
        list.forEach(it=>{const sc=Object.create(scope);sc[as]=it;build(n,sc,out);});continue;}

      for(const a of Array.from(n.attributes)){
        if(a.name.startsWith('hint-'))continue;
        if(/^on[a-z]+$/i.test(a.name)){const m=a.value.match(/\{\{\s*([\w.]+)\s*\}\}/);const fn=m&&get(m[1],scope);if(typeof fn==='function')el.addEventListener(a.name.slice(2).toLowerCase(),fn);continue;}
        el.setAttribute(a.name,sub(a.value,scope));
      }
      if(tag==='input'&&el.hasAttribute('value'))el.value=el.getAttribute('value');
      build(n,scope,el);out.appendChild(el);
    }
  }

    const open=Array.from(document.querySelectorAll('details')).map(d=>d.open), y=window.scrollY;
    const frag=document.createDocumentFragment(); build(tpl,comp.renderVals(),frag);

    const newFilm=document.getElementById('film');

    document.querySelectorAll('details').forEach((d,i)=>{if(open[i])d.open=true;});
