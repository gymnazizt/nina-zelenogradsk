<style>
body{margin:0;background:#05204E;font-family:'Manrope',system-ui,sans-serif;color:#FFFFFF}
a{color:#7DBAFF}a:hover{color:#B9DAFF}
html{scroll-behavior:smooth}
details.q{border-bottom:1px solid #2B64C7}
details.q>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;min-height:44px;font-weight:600;font-size:18px}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary::after{content:"+";color:#7DBAFF;font-size:28px;line-height:1;flex:none}
details.q[open]>summary::after{content:"−"}
details.q>div{padding:0 0 22px;color:#DCE8F8;max-width:760px}
.sea{column-count:3;column-gap:14px}
.sea a{display:block;position:relative;margin:0 0 14px;border-radius:18px;overflow:hidden;break-inside:avoid;background:#0C3375}
@media (max-width:900px){.sea{column-count:2}}
.maplink{color:#7DBAFF;text-decoration:none;font-weight:600;white-space:nowrap}
.maplink:hover{color:#B9DAFF;text-decoration:underline}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:12px;font-weight:600;letter-spacing:0.08em;color:#C5D3E8;padding:4px 0}
.day{aspect-ratio:1/1;min-height:40px;border-radius:12px;border:1px solid #2B64C7;background:rgba(0,27,73,0.68);color:#FFFFFF;font:inherit;font-weight:600;font-size:15px;cursor:pointer;padding:0}
.day.blank{border:0;background:transparent;cursor:default}
.day.past{opacity:0.35;cursor:default}
.day.busy{background:repeating-linear-gradient(135deg,#0A2A66 0 6px,#0D3580 6px 12px);color:#8FA6CF;text-decoration:line-through;cursor:default;border-color:#1E4A9A}
.day.rng{background:#2B64C7}
.day.sel{background:#FFFFFF;color:#043385;border-color:#FFFFFF}
.day.today{box-shadow:0 0 0 2px #7DBAFF inset}
.place{flex:1 1 300px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:22px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #2B64C7}
.step b{flex:none;width:30px;height:30px;border-radius:999px;background:#7DBAFF;color:#043385;display:flex;align-items:center;justify-content:center;font-size:14px}
/* glass */
section[style*="rgba(2,38,100,0.85)"],
section[style*="rgba(2, 38, 100, 0.85)"]{background:linear-gradient(180deg,rgba(255,255,255,0.16),rgba(255,255,255,0.03) 35%),rgba(5,40,110,0.30) !important;-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border-top:1px solid rgba(255,255,255,0.40);border-bottom:1px solid rgba(255,255,255,0.18);box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),0 -10px 30px rgba(0,10,40,0.2)}
:not(section)[style*="rgba(2,38,100,0.85)"],
:not(section)[style*="rgba(2, 38, 100, 0.85)"],
:not(section)[style*="rgba(0,27,73,0.68)"],
:not(section)[style*="rgba(0, 27, 73, 0.68)"],
.place,
.step-card{background:linear-gradient(145deg,rgba(255,255,255,0.30),rgba(255,255,255,0.08) 40%,rgba(255,255,255,0.03)),rgba(8,50,130,0.28) !important;-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,0.45) !important;box-shadow:0 18px 40px rgba(0,10,40,0.35),0 2px 6px rgba(0,10,40,0.2),inset 0 1px 0 rgba(255,255,255,0.65),inset 0 -1px 0 rgba(255,255,255,0.12),inset 0 0 28px rgba(255,255,255,0.06);text-shadow:0 1px 8px rgba(0,10,40,0.55)}
.place{transition:transform .2s ease,box-shadow .2s ease}
.place:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,10,40,0.45),inset 0 1px 0 rgba(255,255,255,0.5)}
.day{background:rgba(255,255,255,0.10);border-color:rgba(255,255,255,0.26);box-shadow:inset 0 1px 0 rgba(255,255,255,0.25)}
.day.blank{background:transparent;box-shadow:none;border:0}
.day.rng{background:rgba(70,140,255,0.62)}
.day.sel{background:#FFFFFF;box-shadow:0 4px 14px rgba(0,10,40,0.4)}
.g,.sea a{box-shadow:0 10px 28px rgba(0,10,40,0.4),0 0 0 1px rgba(255,255,255,0.22)}
details.q{border-bottom-color:rgba(255,255,255,0.22)}
@media (prefers-reduced-motion:reduce){.place{transition:none}}
@keyframes catblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
.catEye{transform-box:fill-box;transform-origin:center;animation:catblink 5s infinite}
.peek{filter:drop-shadow(0 4px 8px rgba(0,10,40,0.45))}
@media (prefers-reduced-motion:reduce){.catEye{animation:none}}
[style*="background:#FFFFFF"],.day.sel,input,textarea,button{text-shadow:none !important}
input[type=date]{color-scheme:dark}
#gallery,#booking>div>div:first-child,#around{text-shadow:0 0 6px rgba(0,0,0,0.7),0 1px 14px rgba(0,0,0,0.85)}
.hero-bg{background:linear-gradient(rgba(1,30,80,0.42),rgba(1,30,80,0.72)),url(images/hero-main.jpg) 38% 50% / cover no-repeat}
.g{flex:1 1 calc(25% - 11px);height:340px}
@media (max-width:900px){.g{flex:1 1 calc(33.33% - 10px)}}
@media (max-width:640px){.g{flex:1 1 calc(50% - 7px);height:230px}}

        <svg class="peek" viewBox="0 0 90 46" width="84" height="43" aria-hidden="true" style="position:absolute;top:-41px;right:36px;pointer-events:none"><path d="M12 26 L14 3 L33 15 Z M78 26 L76 3 L57 15 Z" fill="#07163F" stroke="rgba(255,255,255,0.35)" stroke-width="1"/><path d="M17 20 L18 9 L26 15 Z M73 20 L72 9 L64 15 Z" fill="#1E4A9A"/><path d="M5 46 C5 18 20 8 45 8 C70 8 85 18 85 46 Z" fill="#07163F" stroke="rgba(255,255,255,0.35)" stroke-width="1"/><ellipse class="catEye" cx="32" cy="30" rx="4" ry="5" fill="#7DBAFF"/><ellipse class="catEye" cx="58" cy="30" rx="4" ry="5" fill="#7DBAFF"/><path d="M42 38 L48 38 L45 42 Z" fill="#E7A6B8"/><path d="M26 40 L10 38 M26 43 L12 46 M64 40 L80 38 M64 43 L78 46" stroke="rgba(255,255,255,0.45)" stroke-width="1" fill="none"/></svg>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px">
          <button onClick="{{prevMonth}}" aria-label="Предыдущий месяц" style="width:44px;height:44px;border-radius:999px;border:1px solid #5381D2;background:#011D4D;color:#FFFFFF;font-size:20px;cursor:pointer">‹</button>
          <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600">{{monthTitle}}</div>
          <button onClick="{{nextMonth}}" aria-label="Следующий месяц" style="width:44px;height:44px;border-radius:999px;border:1px solid #5381D2;background:#011D4D;color:#FFFFFF;font-size:20px;cursor:pointer">›</button>
        </div>
        <div class="cal" style="margin-bottom:6px"><div class="wd">Пн</div><div class="wd">Вт</div><div class="wd">Ср</div><div class="wd">Чт</div><div class="wd">Пт</div><div class="wd">Сб</div><div class="wd">Вс</div></div>
        <div class="cal">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
            <button class="{{c.cls}}" aria-label="{{c.label}}" onClick="{{c.pick}}">{{c.n}}</button>
          </sc-for>
        </div>
        <div style="margin-top:16px;font-size:14px;color:#DCE8F8">{{rangeText}}</div>
      </div>
    </div>
  </section>

  <!-- BOOKING -->
  <section id="booking" style="max-width:1120px;margin:0 auto;padding:80px 20px;box-sizing:border-box">
    <div style="display:flex;flex-wrap:wrap;gap:40px 56px;align-items:flex-start">
      <div style="flex:1 1 320px;min-width:0">
        <div style="font-size:13px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#7DBAFF;margin-bottom:16px">Быстрый запрос</div>
        <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:0 0 16px">Запрос на бронь</h2>
        <p style="margin:0 0 16px;font-size:17px;color:#DCE8F8;max-width:480px">Выберите даты и число гостей: откроется Telegram с готовым сообщением для Нины. Останется нажать «Отправить».</p>
        <p style="margin:0 0 12px;font-size:14px;color:#C5D3E8;max-width:480px">Кот-консультант на подтверждение брони не уполномочен: его «мяу» означает «да», но последнее слово всё равно за Ниной.</p>
        <p style="margin:0;font-size:14px;color:#C5D3E8;max-width:480px">Это запрос, а не оплата: мы пока только знакомимся. Бронь подтверждается после ответа Нины.</p>
      </div>
      <div style="position:relative;flex:1 1 380px;min-width:0;background:rgba(2,38,100,0.85);border:1px solid #2B64C7;border-radius:24px;padding:clamp(20px,4vw,32px);box-sizing:border-box">
        <svg class="peek" viewBox="0 0 90 46" width="84" height="43" aria-hidden="true" style="position:absolute;top:-41px;right:36px;pointer-events:none"><path d="M12 26 L14 3 L33 15 Z M78 26 L76 3 L57 15 Z" fill="#07163F" stroke="rgba(255,255,255,0.35)" stroke-width="1"/><path d="M17 20 L18 9 L26 15 Z M73 20 L72 9 L64 15 Z" fill="#1E4A9A"/><path d="M5 46 C5 18 20 8 45 8 C70 8 85 18 85 46 Z" fill="#07163F" stroke="rgba(255,255,255,0.35)" stroke-width="1"/><ellipse class="catEye" cx="32" cy="30" rx="4" ry="5" fill="#7DBAFF"/><ellipse class="catEye" cx="58" cy="30" rx="4" ry="5" fill="#7DBAFF"/><path d="M42 38 L48 38 L45 42 Z" fill="#E7A6B8"/><path d="M26 40 L10 38 M26 43 L12 46 M64 40 L80 38 M64 43 L78 46" stroke="rgba(255,255,255,0.45)" stroke-width="1" fill="none"/></svg>
        <div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px">
          <div style="flex:1 1 160px;min-width:0">
            <label for="ci" style="display:block;font-size:13px;font-weight:600;color:#DCE8F8;margin-bottom:8px">Заезд</label>
            <input id="ci" type="date" value="{{checkin}}" min="{{today}}" onChange="{{setCheckin}}" style="width:100%;box-sizing:border-box;min-height:48px;padding:0 14px;background:#011D4D;color:#FFFFFF;border:1px solid #5381D2;border-radius:12px;font:inherit">
          </div>
          <div style="flex:1 1 160px;min-width:0">
            <label for="co" style="display:block;font-size:13px;font-weight:600;color:#DCE8F8;margin-bottom:8px">Выезд</label>
            <input id="co" type="date" value="{{checkout}}" min="{{minCheckout}}" onChange="{{setCheckout}}" style="width:100%;box-sizing:border-box;min-height:48px;padding:0 14px;background:#011D4D;color:#FFFFFF;border:1px solid #5381D2;border-radius:12px;font:inherit">
          </div>
        </div>
        <div style="font-size:13px;font-weight:600;color:#DCE8F8;margin-bottom:8px">Гостей (до 3)</div>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">
          <button onClick="{{guestsDec}}" aria-label="Меньше гостей" style="width:48px;height:48px;border-radius:999px;border:1px solid #5381D2;background:#011D4D;color:#FFFFFF;font-size:22px;cursor:pointer">−</button>
          <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;font-weight:600;min-width:32px;text-align:center">{{guests}}</span>
          <button onClick="{{guestsInc}}" aria-label="Больше гостей" style="width:48px;height:48px;border-radius:999px;border:1px solid #5381D2;background:#011D4D;color:#FFFFFF;font-size:22px;cursor:pointer">+</button>
        </div>
        <div style="border-top:1px solid #2B64C7;padding-top:16px;margin-bottom:20px;font-size:15px;color:#DCE8F8">{{summary}}</div>
        <sc-if value="{{dateError}}" hint-placeholder-val="{{false}}">
          <div style="margin-bottom:16px;font-size:14px;color:#FFC2B0">Дата выезда должна быть позже даты заезда: машину времени пока не завезли.</div>
        </sc-if>
        <a href="{{bookingLink}}" target="_blank" rel="noopener" style="display:block;text-align:center;background:#FFFFFF;color:#043385;text-decoration:none;font-weight:700;font-size:17px;padding:17px 24px;border-radius:999px">Отправить запрос в Telegram</a>
      </div>
    </div>
  </section>

  <!-- CHECK-IN STEPS -->
  <section id="checkin" style="background:rgba(2,38,100,0.85);padding:80px 0">
    <div style="max-width:1120px;margin:0 auto;padding:0 20px;box-sizing:border-box">
      <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:0 0 16px">Как заселиться</h2>
      <p style="margin:0 0 32px;color:#C5D3E8;max-width:600px">Заселение дистанционное: встречать вас лично не нужно, подойдёт любое время суток.</p>
      <div style="display:flex;flex-wrap:wrap;gap:14px">
        <div style="flex:1 1 240px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box">
          <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:44px;font-weight:600;line-height:1;color:#7DBAFF;margin-bottom:12px">1</div>
          <div style="font-weight:700;font-size:18px;margin-bottom:6px">Отправьте запрос</div>
          <div style="font-size:15px;color:#DCE8F8">Укажите даты и число гостей: проще всего через форму выше.</div>
        </div>
        <div style="flex:1 1 240px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box">
          <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:44px;font-weight:600;line-height:1;color:#7DBAFF;margin-bottom:12px">2</div>
          <div style="font-weight:700;font-size:18px;margin-bottom:6px">Подтвердите бронь</div>
          <div style="font-size:15px;color:#DCE8F8">Нина подтвердит, что даты свободны, и расскажет об условиях, включая страховой депозит.</div>
        </div>
        <div style="flex:1 1 240px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box">
          <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:44px;font-weight:600;line-height:1;color:#7DBAFF;margin-bottom:12px">3</div>
          <div style="font-weight:700;font-size:18px;margin-bottom:6px">Получите инструкцию</div>
          <div style="font-size:15px;color:#DCE8F8">Перед приездом придёт всё нужное для дистанционного заселения.</div>
        </div>
        <div style="flex:1 1 240px;min-width:0;background:rgba(0,27,73,0.68);border:1px solid #2B64C7;border-radius:18px;padding:24px;box-sizing:border-box">
          <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:44px;font-weight:600;line-height:1;color:#7DBAFF;margin-bottom:12px">4</div>
          <div style="font-weight:700;font-size:18px;margin-bottom:6px">Заезжайте с 15:00</div>
          <div style="font-size:15px;color:#DCE8F8">Отдельный вход без подъезда, машиноместо рядом. Чемодан в прихожую, море в программу. Выезд до 12:00.</div>
        </div>
      </div>
    </div>
  </section>

  <!-- AROUND -->
  <section id="around" style="max-width:1120px;margin:0 auto;padding:80px 20px;box-sizing:border-box">
    <div style="display:flex;flex-wrap:wrap;gap:48px 56px">
      <div style="flex:1 1 380px;min-width:0">
        <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:0 0 16px">Что рядом</h2>
        <p style="margin:0 0 20px;color:#C5D3E8">Всё это в пешей доступности. Нажмите «На карте», чтобы построить маршрут.</p>
        <div style="display:flex;flex-direction:column">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #2B64C7"><span>Море и пляж</span><a class="maplink" href="https://yandex.ru/maps/?text=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%BF%D0%BB%D1%8F%D0%B6" target="_blank" rel="noopener">На карте →</a></div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #2B64C7"><span>Площадь Роза ветров</span><a class="maplink" href="https://yandex.ru/maps/?text=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%BF%D0%BB%D0%BE%D1%89%D0%B0%D0%B4%D1%8C%20%D0%A0%D0%BE%D0%B7%D0%B0%20%D0%B2%D0%B5%D1%82%D1%80%D0%BE%D0%B2" target="_blank" rel="noopener">На карте →</a></div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #2B64C7"><span>Колесо обозрения «Глаз Балтики»</span><a class="maplink" href="https://yandex.ru/maps/?text=%D0%93%D0%BB%D0%B0%D0%B7%20%D0%91%D0%B0%D0%BB%D1%82%D0%B8%D0%BA%D0%B8%20%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA" target="_blank" rel="noopener">На карте →</a></div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #2B64C7"><span>Городской парк с прудом</span><a class="maplink" href="https://yandex.ru/maps/?text=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%B3%D0%BE%D1%80%D0%BE%D0%B4%D1%81%D0%BA%D0%BE%D0%B9%20%D0%BF%D0%B0%D1%80%D0%BA" target="_blank" rel="noopener">На карте →</a></div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #2B64C7"><span>Прогулочная набережная</span><a class="maplink" href="https://yandex.ru/maps/?text=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%BD%D0%B0%D0%B1%D0%B5%D1%80%D0%B5%D0%B6%D0%BD%D0%B0%D1%8F" target="_blank" rel="noopener">На карте →</a></div>
        </div>
      </div>
      <div style="flex:1 1 380px;min-width:0">
        <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:0 0 16px">Как добраться</h2>
        <p style="margin:0 0 20px;color:#C5D3E8">Из Калининграда до Зеленоградска проще всего на поезде или автобусе.</p>
        <div style="display:flex;flex-direction:column;margin-bottom:24px">
          <div style="padding:14px 0;border-bottom:1px solid #2B64C7"><div style="font-weight:700">Электричка</div><div style="font-size:15px;color:#DCE8F8">Около 45 минут, от Южного вокзала Калининграда.</div><div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:8px"><a class="maplink" href="https://rasp.yandex.ru/search/?fromName=%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4&amp;toName=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA&amp;transportType=suburban" target="_blank" rel="noopener">Расписание: Калининград → Зеленоградск</a><a class="maplink" href="https://rasp.yandex.ru/search/?fromName=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA&amp;toName=%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4&amp;transportType=suburban" target="_blank" rel="noopener">Обратно →</a></div></div>
          <div style="padding:14px 0;border-bottom:1px solid #2B64C7"><div style="font-weight:700">Автобус</div><div style="font-size:15px;color:#DCE8F8">Около часа, от автовокзала рядом с Южным вокзалом. Рейсы ходят часто.</div><div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:8px"><a class="maplink" href="https://rasp.yandex.ru/search/?fromName=%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4&amp;toName=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA&amp;transportType=bus" target="_blank" rel="noopener">Расписание: Калининград → Зеленоградск</a><a class="maplink" href="https://rasp.yandex.ru/search/?fromName=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA&amp;toName=%D0%9A%D0%B0%D0%BB%D0%B8%D0%BD%D0%B8%D0%BD%D0%B3%D1%80%D0%B0%D0%B4&amp;transportType=bus" target="_blank" rel="noopener">Обратно →</a></div></div>
          <div style="padding:14px 0;border-bottom:1px solid #2B64C7"><div style="font-weight:700">На автомобиле</div><div style="font-size:15px;color:#DCE8F8">У квартиры есть машиноместо.</div></div>
        </div>
        <div style="margin:0 0 24px">
          <div style="font-weight:700;font-size:18px;margin-bottom:4px">От вокзала до квартиры</div>
          <div class="step"><b>1</b><div>Выходите из поезда или автобуса на вокзале Зеленоградска.</div></div>
          <div class="step"><b>2</b><div>Откройте маршрут на карте: пешком или на машине, как удобнее.</div></div>
          <div class="step"><b>3</b><div>Входите через отдельный вход со стороны палисадника. Инструкцию по заселению Нина пришлёт заранее.</div></div>
          <div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px"><a class="maplink" href="https://yandex.ru/maps/?rtext=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%B6%D0%B5%D0%BB%D0%B5%D0%B7%D0%BD%D0%BE%D0%B4%D0%BE%D1%80%D0%BE%D0%B6%D0%BD%D0%B0%D1%8F%20%D1%81%D1%82%D0%B0%D0%BD%D1%86%D0%B8%D1%8F~%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%9E%D0%BA%D1%82%D1%8F%D0%B1%D1%80%D1%8C%D1%81%D0%BA%D0%B0%D1%8F%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0&rtt=pd" target="_blank" rel="noopener">Маршрут пешком →</a><a class="maplink" href="https://yandex.ru/maps/?rtext=%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%B6%D0%B5%D0%BB%D0%B5%D0%B7%D0%BD%D0%BE%D0%B4%D0%BE%D1%80%D0%BE%D0%B6%D0%BD%D0%B0%D1%8F%20%D1%81%D1%82%D0%B0%D0%BD%D1%86%D0%B8%D1%8F~%D0%97%D0%B5%D0%BB%D0%B5%D0%BD%D0%BE%D0%B3%D1%80%D0%B0%D0%B4%D1%81%D0%BA%20%D0%9E%D0%BA%D1%82%D1%8F%D0%B1%D1%80%D1%8C%D1%81%D0%BA%D0%B0%D1%8F%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0&rtt=auto" target="_blank" rel="noopener">Маршрут на машине →</a></div>
        </div>
        <p style="margin:0 0 20px;font-size:14px;color:#C5D3E8">Расписание и цены меняются, ссылки выше открывают актуальные рейсы на Яндекс Расписаниях. Проверьте их перед поездкой.</p>

    const daysIn = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
    const lead = (first.getUTCDay() + 6) % 7;
    const rangeFree = (a, b) => { for (let t = toUtc(a); t < toUtc(b); t += 86400000) if (busy.has(iso(t))) return false; return true; };
    const pick = (day) => () => {
      if (day < today) return;
      const s2 = this.state || {};
      const ci = s2.checkin || '', co = s2.checkout || '';
      if (ci && !co && day > ci && rangeFree(ci, day)) { this.setState({ checkout: day }); return; }
      if (busy.has(day)) return;
      this.setState({ checkin: day, checkout: '' });
    };
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push({ cls: 'day blank', n: '', label: '', pick: () => {} });
    for (let n = 1; n <= daysIn; n++) {
      const day = iso(Date.UTC(first.getUTCFullYear(), first.getUTCMonth(), n));
      const cls = ['day'];
      if (day < today) cls.push('past');
      else if (busy.has(day)) cls.push('busy');
      if (day === today) cls.push('today');
      if (day === checkin || day === checkout) cls.push('sel');
      else if (checkin && checkout && day > checkin && day < checkout) cls.push('rng');
      cells.push({ cls: cls.join(' '), n: String(n), label: fmt(day) + (busy.has(day) ? ', занято' : ''), pick: pick(day) });
    }
    const rangeText = checkin && checkout && nights > 0
      ? 'Выбрано: ' + fmt(checkin) + ' → ' + fmt(checkout) + ', ' + nights + ' ' + word(nights, 'ночь', 'ночи', 'ночей') + '. Даты уже в форме брони ниже.'
      : checkin ? 'Заезд ' + fmt(checkin) + '. Теперь выберите день выезда.' : 'Даты пока не выбраны.';
    const placeCats = ["Закат", "Прогулка", "Кофе", "Ужин", "Покупки", "Море"];
    const places = [1, 2, 3, 4, 5, 6].map((i) => {
      const name = String(this.props['place' + i + 'Name'] ?? '').trim();
      return { cat: placeCats[i - 1], name: name, note: String(this.props['place' + i + 'Note'] ?? '').trim(),
               link: 'https://yandex.ru/maps/?text=' + encodeURIComponent('Зеленоградск ' + name) };
    }).filter((p) => p.name);
    const base = 'https://t.me/' + encodeURIComponent(u);
    return {
      cells: cells, places: places, rangeText: rangeText, hasBusy: busy.size > 0, noBusy: busy.size === 0,
      monthTitle: monthNames[first.getUTCMonth()] + ' ' + first.getUTCFullYear(),
      prevMonth: () => this.setState({ month: Math.max(0, off - 1) }),
      nextMonth: () => this.setState({ month: Math.min(14, off + 1) }),
      reviewOpen: !!st.reviewOpen,
      reviewSent: !!st.reviewSent,
      openReview: () => this.setState({ reviewOpen: true, reviewSent: false }),
      closeReview: () => this.setState({ reviewOpen: false }),
      sendReview: () => {
        const t = document.getElementById('rv-text');
        const nm = document.getElementById('rv-name');
        const text = t ? t.value.trim() : '';
        if (!text) { if (t) { t.style.borderColor = '#FFC2B0'; t.focus(); } return; }
        const name = nm ? nm.value.trim() : '';
        const m = 'Отзыв о квартире в Зеленоградске' + (name ? ' от гостя ' + name : '') + ': «' + text + '»';
        const a = document.createElement('a');
        a.href = base + '?text=' + encodeURIComponent(m);
        a.target = '_blank'; a.rel = 'noopener';
        document.body.appendChild(a); a.click(); a.remove();
        this.setState({ reviewOpen: false, reviewSent: true });
      },
      tgLink: base,
      tgHandle: '@' + u,
      reviews: reviews,
      hasReviews: reviews.length > 0,
      noReviews: reviews.length === 0,
      today: today,
      checkin: checkin,
      checkout: checkout,
      minCheckout: checkin || today,
      guests: guests,
      summary: summary,
      dateError: dateError,
      bookingLink: base + '?text=' + encodeURIComponent(msg),
      setCheckin: (e) => this.setState({ checkin: e.target.value }),
      setCheckout: (e) => this.setState({ checkout: e.target.value }),
      guestsInc: () => this.setState({ guests: Math.min(3, guests + 1) }),
      guestsDec: () => this.setState({ guests: Math.max(1, guests - 1) })
    };
  }
}

(function(){
  const tpl=document.getElementById('tpl').content, app=document.getElementById('app');
  const get=(p,s)=>p.split('.').reduce((o,k)=>o==null?o:o[k],s);
  const sub=(str,s)=>str.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(_,p)=>{const v=get(p,s);return v==null?'':v;});
  function build(src,scope,out){
    for(const n of Array.from(src.childNodes)){
      if(n.nodeType===3){out.appendChild(document.createTextNode(sub(n.nodeValue,scope)));continue;}
      if(n.nodeType!==1)continue;
      const tag=n.localName;
      if(tag==='sc-if'){const m=(n.getAttribute('value')||'').match(/\{\{\s*([\w.]+)\s*\}\}/);if(m&&get(m[1],scope))build(n,scope,out);continue;}
      if(tag==='sc-for'){const m=(n.getAttribute('list')||'').match(/\{\{\s*([\w.]+)\s*\}\}/);const as=n.getAttribute('as');const list=(m&&get(m[1],scope))||[];
        list.forEach(it=>{const sc=Object.create(scope);sc[as]=it;build(n,sc,out);});continue;}
      const el=document.createElementNS(n.namespaceURI,tag);
      for(const a of Array.from(n.attributes)){
        if(a.name.startsWith('hint-'))continue;
        if(/^on[a-z]+$/i.test(a.name)){const m=a.value.match(/\{\{\s*([\w.]+)\s*\}\}/);const fn=m&&get(m[1],scope);if(typeof fn==='function')el.addEventListener(a.name.slice(2).toLowerCase(),fn);continue;}
        el.setAttribute(a.name,sub(a.value,scope));
      }
      if(tag==='input'&&el.hasAttribute('value'))el.value=el.getAttribute('value');
      build(n,scope,el);out.appendChild(el);
    }
  }
  const comp=new Component(CONFIG);
  window.__rerender=function(){
    const open=Array.from(document.querySelectorAll('details')).map(d=>d.open), y=window.scrollY;
    const frag=document.createDocumentFragment(); build(tpl,comp.renderVals(),frag);
    app.replaceChildren(frag);
    document.querySelectorAll('details').forEach((d,i)=>{if(open[i])d.open=true;});
    window.scrollTo(0,y);
  };
  window.__rerender();
})();

</script>
